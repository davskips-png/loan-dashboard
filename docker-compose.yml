version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: loan-dashboard-db
    environment:
      POSTGRES_USER: ${DB_USER:-loanuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loanpass123}
      POSTGRES_DB: ${DB_NAME:-loan_dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    networks:
      - loan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-loanuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan-dashboard-api
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-loanuser}:${DB_PASSWORD:-loanpass123}@postgres:5432/${DB_NAME:-loan_dashboard}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      JWT_EXPIRE: 7d
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules
    networks:
      - loan-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loan-dashboard-web
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/node_modules:/app/node_modules
    networks:
      - loan-network
    command: npm run dev

volumes:
  postgres_data:

networks:
  loan-network:
    driver: bridge